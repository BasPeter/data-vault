name: Test and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux Secret Service
        run: sudo apt-get update && sudo apt-get install --yes gnome-keyring libsecret-1-0 libsecret-tools

      - name: Run Playwright end-to-end tests
        # The Electron runner uses the app's bundled Chromium, so no browser
        # download is needed. xvfb provides a virtual display and gnome-keyring
        # provides OS-keychain-backed encryption on the runner.
        run: |
          dbus-run-session -- bash -c '
            set -euo pipefail
            keyring_password="$(head -c 32 /dev/urandom | base64)"
            printf %s "$keyring_password" | gnome-keyring-daemon --daemonize --unlock --components=secrets
            unset keyring_password
            # Prove the Secret Service actually serves a default collection before
            # Playwright starts. This is the same store-into-default-collection
            # path Chromium uses to derive its encryption key, so a broken keyring
            # fails here with a clear message instead of surfacing later as an
            # opaque safeStorage assertion. gnome-keyring swallows its own
            # initialization failures and still exits 0, so this probe is the only
            # thing that can detect them.
            # Bounded: a locked collection with no prompter available makes these
            # calls block on a prompt that never resolves, which would recreate
            # the opaque failure this probe exists to remove.
            timeout 30 bash -c "printf %s probe-value | secret-tool store --label=ci-probe data-vault ci-probe"
            timeout 30 secret-tool lookup data-vault ci-probe > /dev/null
            timeout 30 secret-tool clear data-vault ci-probe
            XDG_CURRENT_DESKTOP=GNOME xvfb-run -a npm run test:e2e
          '

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload e2e screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: screenshots
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package for ${{ matrix.name }}
    # TEMPORARY. Deliberately does not depend on `e2e`: the suite runs on Linux
    # only, and a Linux-specific keyring bug blocked macOS and Windows installers
    # for four days across v0.16.0, v0.17.0, and v0.17.1.
    #
    # The cost is real and larger than the Linux keyring: a tagged push now
    # publishes a GitHub Release even when e2e fails outright, including the nine
    # tests that cover actual application behaviour on every platform. Only `test`
    # (lint, unit, build) gates a release today.
    #
    # Exit condition: restore `needs: [test, e2e]` once the Linux keyring probe is
    # green. See openspec/changes/decouple-package-from-e2e-gate/.
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: data-vault-linux
          - name: macOS
            os: macos-latest
            artifact: data-vault-macos
          - name: Windows
            os: windows-latest
            artifact: data-vault-windows
    runs-on: ${{ matrix.os }}
    # The GitHub OAuth device-flow client id is public (baked into the bundle), so
    # it lives in a repository variable rather than a secret. Empty disables sign-in.
    env:
      DATA_VAULT_GITHUB_CLIENT_ID: ${{ vars.DATA_VAULT_GITHUB_CLIENT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build non-macOS installers
        if: matrix.name != 'macOS'
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build unsigned macOS installers
        if: matrix.name == 'macOS' && !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Prepare App Store Connect API key
        if: matrix.name == 'macOS' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
        run: |
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build signed and notarized macOS installers
        if: matrix.name == 'macOS' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: npm run dist -- --publish never --config.forceCodeSigning=true
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.yml
            dist/*.blockmap

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: data-vault-*
          path: release-assets
          merge-multiple: true

      - name: Create release and upload installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
          fi
          mapfile -d '' assets < <(find release-assets -type f -print0)
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
